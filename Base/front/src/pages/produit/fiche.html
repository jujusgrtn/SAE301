<nav aria-label="Fil d'Ariane" class="mb-6 text-[0.8125rem] text-muted">
  <ol class="flex flex-wrap items-center gap-x-1.5">
    <li><a href="{{urlCatalogue}}" data-link class="underline-offset-2 hover:text-primary-text hover:underline">Catalogue</a></li>
    <li><span aria-hidden="true">›</span> <a href="{{urlCategorie}}" data-link class="underline-offset-2 hover:text-primary-text hover:underline">{{categorie}}</a></li>
    <li><span aria-hidden="true">›</span> <a href="{{urlSousCategorie}}" data-link class="underline-offset-2 hover:text-primary-text hover:underline">{{sousCategorie}}</a></li>
    <li><span aria-hidden="true">›</span> <span aria-current="page">{{nom}}</span></li>
  </ol>
</nav>

<div class="grid gap-8 md:grid-cols-2 md:gap-10">
  <div>
    <div data-zone="photo" class="aspect-square overflow-hidden rounded-md bg-surface-soft"></div>
    <div data-zone="miniatures"></div>
  </div>

  <div>
    <p class="text-[0.6875rem] font-semibold tracking-wider text-primary-text uppercase">{{categorie}} · {{sousCategorie}}</p>
    <h1 class="mt-1 text-2xl font-semibold tracking-tight sm:text-3xl">{{nom}}</h1>
    <p class="mt-3 text-xl font-semibold">{{prix}}</p>
    <!-- Disponibilité de la variante choisie : remplie par V.renderStock(). -->
    <div data-zone="stock" class="mt-1.5"></div>
    <p class="mt-5 max-w-prose leading-relaxed">{{description}}</p>

    <div data-zone="ajout-panier" class="mt-6 flex flex-col items-stretch gap-3 sm:items-start"></div>
    <!-- Région vivante présente dès l'affichage : les messages qui y arrivent
         ensuite sont annoncés par les lecteurs d'écran. -->
    <div data-zone="retour-panier" role="status" class="mt-3 min-h-5 text-sm font-medium"></div>

    <div class="mt-8 rounded-md bg-primary-soft px-4 py-3 text-sm">
      <p class="font-semibold">Retrait gratuit en boutique</p>
      <p class="mt-1">Réservez en ligne, essayez et réglez sur place, au centre Vaima à Papeete.</p>
    </div>
  </div>
</div>
