<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAE301-Starter</title>
    <link rel="stylesheet" href="/src/global.css" />

    <!--
      Application du thème avant le premier affichage. Script ordinaire et non
      module : le navigateur l'exécute avant de dessiner la page, qui
      n'apparaît donc jamais, même brièvement, dans le mauvais thème.
      Le thème est conservé en localStorage : le serveur n'en a pas besoin.

      Le localStorage est partagé par TOUTES les pages d'une même origine, donc
      par tous les sites hébergés sous https://mmi.unilim.fr/~login/… : une clé
      générique comme « theme » serait lue et écrasée par les sites des autres.
      La clé porte donc le chemin du projet (%BASE_URL% est remplacé par Vite) ;
      lib/theme.js construit la même.
    -->
    <script>
      try {
        if (localStorage.getItem("matira:%BASE_URL%:theme") === "sombre") {
          document.documentElement.classList.add("theme-dark");
        }
      } catch (e) {
        // localStorage indisponible : on reste en thème clair.
      }
    </script>
  </head>
  <body class="bg-white text-zinc-950 antialiased dark:bg-zinc-950 dark:text-zinc-50">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
