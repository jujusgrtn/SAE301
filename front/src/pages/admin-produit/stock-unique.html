<div class="flex flex-col gap-1.5">
  <label for="produit-stock" class="text-sm font-medium">Stock</label>
  <input id="produit-stock" name="stock" type="number" required min="0" max="9999" step="1" inputmode="numeric" value="{{stock}}" aria-describedby="aide-stock" class="h-11 rounded-md border border-line bg-transparent px-3">
  <p id="aide-stock" class="text-[0.8125rem] text-muted">Chaque changement est enregistré dans le journal de stock.</p>
</div>
