<slot name="annonce"></slot>

<form data-form="connexion-admin" class="flex flex-col gap-[18px]">
  <div class="flex flex-col gap-1.5">
    <label for="admin-identifiant" class="text-sm font-semibold">Identifiant</label>
    <input id="admin-identifiant" name="identifiant" type="text" required maxlength="60" autocomplete="username" autocapitalize="none" spellcheck="false" value="{{identifiant}}" class="h-12 rounded-sm border border-line bg-white px-4 text-base text-ink">
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="admin-mot-de-passe" class="text-sm font-semibold">Mot de passe</label>
    <input id="admin-mot-de-passe" name="motDePasse" type="password" required autocomplete="current-password" class="h-12 rounded-sm border border-line bg-white px-4 text-base text-ink aria-invalid:border-2 aria-invalid:border-danger">
    <slot name="erreur"></slot>
  </div>

  <button type="submit" class="bouton-principal h-12 w-full px-6">Se connecter</button>
</form>
