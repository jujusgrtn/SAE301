<nav aria-label="Filtrer mes réservations par statut" class="mb-4">
  <ul data-zone="statuts" class="flex flex-wrap gap-2"></ul>
</nav>

<form data-zone="periode" action="" method="get" novalidate class="mb-5 rounded-md border border-line p-4">
  <fieldset>
    <legend class="text-sm font-semibold">Période</legend>
    <input type="hidden" name="statut" value="{{statut}}">
    <div class="mt-2 flex flex-wrap items-end gap-x-4 gap-y-3">
      <div>
        <label for="filtre-du" class="block text-[0.8125rem] text-muted">Du</label>
        <input id="filtre-du" name="du" type="date" value="{{du}}" class="mt-1 h-11 rounded-md border border-line bg-transparent px-3 text-sm">
      </div>
      <div>
        <label for="filtre-au" class="block text-[0.8125rem] text-muted">Au</label>
        <input id="filtre-au" name="au" type="date" value="{{au}}" class="mt-1 h-11 rounded-md border border-line bg-transparent px-3 text-sm">
      </div>
      <button type="submit" class="h-11 rounded-md bg-button px-6 text-sm font-semibold text-white transition-opacity hover:opacity-90">Appliquer</button>
      <slot name="reinitialiser"></slot>
    </div>
    <p data-zone="erreur-periode" role="alert" class="mt-2 text-sm text-danger empty:hidden"></p>
  </fieldset>
</form>
