<li class="grid grid-cols-2 items-center gap-x-4 gap-y-1 p-3 sm:grid-cols-[1fr_7rem_8rem_11rem] sm:p-4">
  <div class="min-w-0">
    <p class="text-sm font-semibold"><a href="{{href}}" data-link class="transition-colors hover:text-primary-text">{{numero}}</a></p>
    <p class="text-[0.8125rem] text-muted">{{date}}</p>
  </div>
  <p class="text-sm sm:text-right"><span class="text-muted sm:hidden">Articles : </span>{{articles}}</p>
  <p class="text-sm font-semibold sm:text-right">{{total}}</p>
  <div><slot name="statut"></slot></div>
</li>
