<div role="group" aria-labelledby="titre-confirmation" class="mt-3 rounded-md border border-danger p-4">
  <p id="titre-confirmation" class="text-sm font-semibold text-danger">Annuler cette réservation ?</p>
  <p class="mt-1 text-sm text-muted">Le statut devient « annulée », définitivement. Les bijoux retirés du stock à la réservation y sont remis en vente.</p>
  <div class="mt-3 flex flex-wrap gap-3">
    <button type="button" data-action="confirmer-annulation" class="h-10 rounded-md border border-danger px-4 text-sm font-semibold text-danger transition-colors hover:bg-danger/10 aria-disabled:cursor-wait aria-disabled:opacity-60">Oui, annuler la réservation</button>
    <button type="button" data-action="abandonner-annulation" class="h-10 rounded-md border border-line px-4 text-sm font-medium transition-colors hover:border-primary aria-disabled:opacity-60">Non, la garder</button>
  </div>
</div>
