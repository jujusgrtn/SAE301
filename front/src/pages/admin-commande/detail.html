<div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
  <h1 class="text-2xl font-semibold tracking-tight">Réservation {{numero}}</h1>
  <slot name="statut"></slot>
</div>
<p class="mt-1 text-sm text-muted">Passée le {{date}}</p>

<slot name="message"></slot>

<div class="mt-6 grid gap-6 md:grid-cols-[1fr_16rem] md:items-start">
  <section aria-labelledby="titre-bijoux">
    <h2 id="titre-bijoux" class="text-lg font-semibold">Bijoux réservés</h2>
    <ul class="mt-3 divide-y divide-line border-y border-line">
      <slot name="lignes"></slot>
    </ul>
    <dl class="mt-4 flex items-baseline justify-between gap-4">
      <dt class="text-sm">Total à régler en boutique ({{articles}})</dt>
      <dd class="text-lg font-semibold">{{total}}</dd>
    </dl>
  </section>

  <aside aria-labelledby="titre-client" class="rounded-md bg-surface-soft p-5">
    <h2 id="titre-client" class="text-base font-semibold">Client</h2>
    <p class="mt-1 text-sm">{{client}}</p>
    <p class="text-sm break-all text-muted">{{email}}</p>
    <p class="mt-3 text-[0.8125rem] text-muted">Retrait au centre Vaima, à Papeete.</p>
  </aside>
</div>

<section aria-labelledby="titre-actions" class="mt-8 rounded-md border border-line p-5">
  <h2 id="titre-actions" class="text-base font-semibold">Suivi</h2>
  <slot name="actions"></slot>
</section>
