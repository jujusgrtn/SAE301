<li class="grid gap-x-4 gap-y-1 p-3 sm:grid-cols-[11rem_7rem_1fr] sm:p-4">
  <p class="text-[0.8125rem] text-muted">{{date}}</p>
  <p class="text-sm font-medium">{{administrateur}}</p>
  <div class="min-w-0 text-sm">
    <p><a href="{{href}}" data-link class="font-semibold transition-colors hover:text-primary-text">{{cible}}</a> : {{changement}}</p>
    <p class="text-[0.8125rem] text-muted empty:hidden">{{precision}}</p>
  </div>
</li>
