<form data-form="code-promo" novalidate class="mt-4 border-t border-line pt-4">
  <label for="code-promo" class="text-sm font-medium">Code promo</label>
  <div class="mt-1.5 flex gap-2">
    <input id="code-promo" name="code" type="text" maxlength="30" autocomplete="off" autocapitalize="characters" spellcheck="false" value="{{valeur}}" aria-describedby="aide-code-promo" class="h-11 min-w-0 flex-1 rounded-md border border-line bg-transparent px-3 text-sm uppercase">
    <button type="submit" class="h-11 shrink-0 rounded-md border border-line px-4 text-sm font-semibold transition-colors hover:border-primary aria-disabled:cursor-wait aria-disabled:opacity-60">Appliquer</button>
  </div>
  <p id="aide-code-promo" class="mt-1 text-[0.8125rem] text-muted">Facultatif. La réduction s'applique au total.</p>
  <slot name="erreur"></slot>
</form>
