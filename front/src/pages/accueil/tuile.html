<li>
  <a href="{{href}}" data-link class="group block">
    <div class="h-[130px] overflow-hidden rounded-sm bg-surface-soft lg:h-[300px]">
      <img src="{{src}}" alt="" loading="lazy" decoding="async" class="size-full object-cover transition-transform duration-300 group-hover:scale-105 motion-reduce:transition-none">
    </div>
    <p class="mt-2 text-base font-semibold lg:mt-3 lg:titre-h3 group-hover:text-primary-text">{{nom}}</p>
    <p class="hidden text-sm text-muted lg:block">{{effectif}}</p>
  </a>
</li>
