<li class="p-3 sm:p-4">
  <div class="grid grid-cols-2 items-center gap-x-4 gap-y-1 lg:grid-cols-[1fr_5rem_6rem_6rem_9rem_9rem]">
    <p class="text-sm font-semibold">{{code}}</p>
    <p class="text-sm lg:text-right"><span class="text-muted lg:hidden">Réduction : </span>{{pourcentage}}</p>
    <p class="text-sm {{couleurEtat}}">{{etat}}</p>
    <p class="text-sm lg:text-right"><span class="text-muted lg:hidden">Utilisations : </span>{{utilisations}}<span class="text-[0.8125rem] text-muted empty:hidden">{{annulees}}</span></p>
    <p class="text-sm lg:text-right"><span class="text-muted lg:hidden">Réduit au total : </span>{{reduction}}</p>
    <p class="text-sm lg:text-right"><span class="text-muted lg:hidden">Réservé : </span>{{montant}}</p>
  </div>
  <div data-zone="actions" class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-2">
    <slot name="actions"></slot>
  </div>
</li>
