<section aria-labelledby="titre-nouveau" class="rounded-md border border-line p-5">
  <h2 id="titre-nouveau" class="text-lg font-semibold">Nouveau code</h2>
  <form data-form="creer" novalidate class="mt-3 flex flex-wrap items-end gap-x-4 gap-y-3">
    <div class="flex flex-col gap-1">
      <label for="nouveau-code" class="text-[0.8125rem] text-muted">Code</label>
      <input id="nouveau-code" name="code" type="text" required maxlength="30" autocomplete="off" autocapitalize="characters" spellcheck="false" value="{{code}}" class="h-11 w-48 rounded-md border border-line bg-transparent px-3 text-sm uppercase">
    </div>
    <div class="flex flex-col gap-1">
      <label for="nouveau-pourcentage" class="text-[0.8125rem] text-muted">Réduction (%)</label>
      <input id="nouveau-pourcentage" name="pourcentage" type="number" required min="1" max="100" step="1" inputmode="numeric" value="{{pourcentage}}" class="h-11 w-28 rounded-md border border-line bg-transparent px-3 text-sm">
    </div>
    <label class="flex h-11 items-center gap-2 text-sm"><input type="checkbox" name="actif" checked class="size-4 accent-[var(--clr-primary-text)]"> Actif</label>
    <button type="submit" class="h-11 rounded-md bg-button px-6 text-sm font-semibold text-white transition-opacity hover:opacity-90 aria-disabled:cursor-wait aria-disabled:opacity-60">Créer le code</button>
  </form>
  <slot name="erreur-creation"></slot>
</section>

<section aria-labelledby="titre-liste" class="mt-8">
  <h2 id="titre-liste" class="text-lg font-semibold">Codes et utilisation</h2>
  <slot name="liste"></slot>
  <slot name="supprimes"></slot>
</section>
