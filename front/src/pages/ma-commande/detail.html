<div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
  <h1 class="text-2xl font-semibold tracking-tight">Réservation {{numero}}</h1>
  <slot name="statut"></slot>
</div>
<p class="mt-1 text-sm text-muted">Validée le {{date}}</p>
<p class="mt-4 rounded-md bg-surface-soft px-4 py-3 text-sm">{{indication}}</p>

<section aria-labelledby="titre-bijoux" class="mt-8">
  <h2 id="titre-bijoux" class="text-lg font-semibold">Bijoux réservés</h2>
  <ul class="mt-3 divide-y divide-line border-y border-line">
    <slot name="lignes"></slot>
  </ul>
  <dl class="mt-4 flex items-baseline justify-between gap-4">
    <dt class="text-sm">Total ({{articles}})</dt>
    <dd class="text-lg font-semibold">{{total}}</dd>
  </dl>
</section>
