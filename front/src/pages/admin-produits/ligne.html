<li class="grid grid-cols-[3.5rem_1fr] items-center gap-x-4 gap-y-1 p-3 sm:p-4 md:grid-cols-[3.5rem_1fr_8rem_9rem]">
  <div class="row-span-2 size-14 overflow-hidden rounded-md bg-surface-soft md:row-span-1">
    <slot name="image"></slot>
  </div>

  <div class="min-w-0">
    <p class="truncate text-[0.6875rem] font-semibold tracking-wider text-primary-text uppercase">{{categorie}} · {{sousCategorie}}</p>
    <p class="text-sm leading-snug font-medium"><a href="{{href}}" data-link class="transition-colors hover:text-primary-text">{{nom}}</a></p>
  </div>

  <div class="flex flex-wrap items-center gap-x-4 gap-y-1 md:contents">
    <p class="text-sm font-semibold md:text-right">{{prix}}</p>
    <p class="text-sm font-medium md:text-right {{couleurStock}}">{{stock}}</p>
  </div>
</li>
