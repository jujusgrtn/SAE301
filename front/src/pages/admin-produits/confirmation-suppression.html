<div role="group" aria-label="Confirmer la suppression de {{nom}}" class="flex flex-wrap items-center gap-x-3 gap-y-2 md:justify-end">
  <p class="text-[0.8125rem] font-medium text-danger">Supprimer définitivement ?</p>
  <button type="button" data-action="confirmer-suppression" data-id="{{id}}" class="h-9 rounded-md border border-danger px-3 text-sm font-semibold text-danger transition-colors hover:bg-danger/10 aria-disabled:cursor-wait aria-disabled:opacity-60">Oui, supprimer</button>
  <button type="button" data-action="annuler-suppression" data-id="{{id}}" class="h-9 rounded-md border border-line px-3 text-sm font-medium transition-colors hover:border-primary aria-disabled:opacity-60">Annuler</button>
</div>
