<form data-form="categorie" class="flex flex-col gap-5">
  <!-- Erreur du serveur : remplie sans reconstruire le formulaire, pour garder la saisie. -->
  <div data-zone="erreur-formulaire"></div>

  <slot name="emplacement"></slot>

  <div class="flex flex-col gap-1.5">
    <label for="categorie-nom" class="text-sm font-medium">Nom</label>
    <input id="categorie-nom" name="nom" type="text" required maxlength="60" value="{{nom}}" class="h-11 rounded-md border border-line bg-transparent px-3">
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="categorie-description" class="text-sm font-medium">Description</label>
    <textarea id="categorie-description" name="description" rows="3" maxlength="255" aria-describedby="aide-description" class="rounded-md border border-line bg-transparent px-3 py-2">{{description}}</textarea>
    <p id="aide-description" class="text-[0.8125rem] text-muted">Facultative, 255 caractères au plus. Affichée en tête de la page de la catégorie.</p>
  </div>

  <div class="flex flex-wrap items-center gap-3">
    <button type="submit" class="h-11 rounded-md bg-button px-6 text-sm font-semibold text-white transition-opacity hover:opacity-90 aria-disabled:cursor-wait aria-disabled:opacity-60">{{libelleBouton}}</button>
    <a href="{{urlListe}}" data-link class="inline-flex h-11 items-center px-3 text-sm font-medium underline underline-offset-2">Annuler</a>
  </div>
</form>
