<li class="grid grid-cols-2 items-center gap-x-4 gap-y-1 p-3 sm:p-4 md:grid-cols-[9rem_1fr_6rem_9rem_10rem]">
  <div class="flex min-w-0 items-start gap-3">
    <input type="checkbox" data-action="selectionner" data-numero="{{numero}}" aria-label="Sélectionner la réservation {{numero}}" class="mt-0.5 size-4 shrink-0 accent-[var(--clr-primary-text)]">
    <div class="min-w-0">
      <p class="text-sm font-semibold"><a href="{{href}}" data-link class="transition-colors hover:text-primary-text">{{numero}}</a></p>
      <p class="text-[0.8125rem] text-muted">{{date}}</p>
    </div>
  </div>

  <div class="min-w-0">
    <p class="truncate text-sm font-medium">{{client}}</p>
    <p class="truncate text-[0.8125rem] text-muted">{{email}}</p>
  </div>

  <p class="text-sm md:text-right"><span class="text-muted md:hidden">Articles : </span>{{articles}}</p>
  <p class="text-sm font-semibold md:text-right">{{total}}</p>
  <div><slot name="statut"></slot></div>
</li>
