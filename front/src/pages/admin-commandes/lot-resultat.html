<div data-zone="resultat-lot" role="status" tabindex="-1" class="mb-4 rounded-md bg-surface-soft p-4 focus:outline-none">
  <p class="text-sm font-semibold {{couleur}}">{{titre}}</p>
  <ul data-zone="refus" class="mt-2 list-disc space-y-1 pl-5 text-sm">
    <slot name="refus"></slot>
  </ul>
  <button type="button" data-action="lot-fermer" class="mt-3 text-[0.8125rem] text-muted underline underline-offset-2 hover:text-primary-text">Fermer</button>
</div>
