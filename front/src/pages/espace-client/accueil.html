<h1 class="text-2xl font-semibold tracking-tight">Bonjour, {{prenom}} !</h1>
<p class="mt-1 text-sm text-muted">Bienvenue dans votre espace Matira Création.</p>

<div class="mt-6 grid gap-6 md:grid-cols-2">
  <section aria-labelledby="titre-infos" class="rounded-md border border-line p-5">
    <h2 id="titre-infos" class="text-base font-semibold">Mes informations</h2>
    <dl class="mt-3 space-y-3 text-sm">
      <div>
        <dt class="text-muted">Nom</dt>
        <dd class="font-medium">{{nomComplet}}</dd>
      </div>
      <div>
        <dt class="text-muted">E-mail</dt>
        <dd class="font-medium break-all">{{email}}</dd>
      </div>
    </dl>
    <a href="{{urlProfil}}" data-link class="mt-4 inline-block text-sm font-medium text-primary-text underline underline-offset-2">Modifier mon profil</a>
  </section>

  <section aria-labelledby="titre-activite" class="rounded-md border border-line p-5">
    <h2 id="titre-activite" class="text-base font-semibold">Mon activité</h2>
    <slot name="activite"></slot>
  </section>
</div>

<div class="mt-8 flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-center">
  <a href="{{urlPanier}}" data-link class="inline-flex h-11 items-center justify-center rounded-md bg-button px-6 text-sm font-semibold text-white transition-opacity hover:opacity-90">Voir mon panier</a>
  <a href="{{urlCatalogue}}" data-link class="inline-flex h-11 items-center justify-center rounded-md border border-line px-6 text-sm font-semibold transition-colors hover:border-primary">Continuer mes achats</a>
  <button type="button" data-action="deconnexion" class="h-11 px-2 text-sm text-muted underline underline-offset-2 hover:text-danger aria-disabled:cursor-wait sm:ml-auto">Se déconnecter</button>
</div>
<p class="mt-3 text-[0.8125rem] text-muted">La déconnexion vide votre panier.</p>
