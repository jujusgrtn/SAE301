<!-- Le lien du nom s'étend à toute la carte (after:inset-0) : une seule cible
     cliquable, et un seul lien annoncé par les lecteurs d'écran. -->
<article class="group relative flex flex-col gap-1.5">
  <div class="h-[190px] overflow-hidden rounded-sm bg-surface-soft">
    <slot name="image"></slot>
  </div>

  <p class="mt-1 texte-surtitre text-primary-text">{{categorie}}</p>
  <h2 class="text-sm leading-5"><a href="{{href}}" data-link class="transition-colors group-hover:text-primary-text after:absolute after:inset-0 after:content-['']">{{nom}}</a></h2>
  <p class="prix-normal"><slot name="prix"></slot></p>
  <div><slot name="stock"></slot></div>
</article>
