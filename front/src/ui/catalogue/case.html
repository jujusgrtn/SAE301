<label class="flex cursor-pointer items-center gap-2.5 text-sm">
  <span class="relative grid size-5 shrink-0 place-items-center rounded-sm border-[1.5px] border-line bg-white has-checked:border-brand-dark has-checked:bg-brand-dark has-focus-visible:outline-2 has-focus-visible:outline-offset-2 has-focus-visible:outline-brand-dark">
    <input type="checkbox" data-filter="{{filtre}}" data-value="{{valeur}}" value="{{valeur}}" class="peer absolute inset-0 size-full cursor-pointer opacity-0">
    <img src="{{iconeCheck}}" alt="" width="14" height="14" class="hidden size-3.5 peer-checked:block">
  </span>
  {{libelle}}
</label>
